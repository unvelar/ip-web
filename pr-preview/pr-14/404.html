<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA redirect: rewrite the full client route as a query param so
    // index.html can restore it after GitHub Pages serves this 404 fallback.
    // PR previews have their own app bundle under /pr-preview/pr-N/, so send
    // those routes to that preview index rather than the production index.
    var previewBase = window.location.pathname.match(/^\/pr-preview\/pr-\d+(?:\/|$)/);
    var appBase = previewBase ? previewBase[0] : '/';
    if (!appBase.endsWith('/')) appBase += '/';

    // Use the concrete preview entry point. Redirecting a missing preview route
    // back to the preview directory can be handled as another 404 by the host,
    // causing each pass to wrap the previous `p` value in a new `p` value.
    var entryPoint = previewBase ? appBase + 'index.html' : appBase;
    var query = new URLSearchParams(window.location.search);
    var path = query.get('p') || (
      window.location.pathname + window.location.search + window.location.hash
    );
    window.location.replace(
      window.location.origin + entryPoint + '?p=' + encodeURIComponent(path)
    );
  </script>
</head>
</html>
